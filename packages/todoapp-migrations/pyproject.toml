[project]
name = "todoapp-migrations"
version = "0.1.0"
description = "Project to understand how works migrations in flask"
readme = "README.md"
authors = [
    { name = "Sergio L. Benítez D.", email = "sergio.kun21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
todoapp = "todoapp:main"

[tool.poetry.dependencies]
python = "^3.7"
flask = "^1.1.2"
flask-sqlalchemy = "^2.4.1"
flask-migrate = "4.1.0"
psycopg2 = "^2.8.5"

[tool.poetry.dev-dependencies]
pytest = "^5.2"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
