[project]
name = "todoapp_crud"
version = "0.1.0"
description = "Dummy todo app for check CRUD concepts on python"
readme = "README.md"
authors = [
    { name = "Sergio Benítez", email = "sergio.kun21@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "flask>=1.1.2",
    "flask-sqlalchemy>=2.4.1",
    "flask-migrate==4.1.0",
    "psycopg2-binary>=2.8.5",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=5.2"]

[project.scripts]
todoapp-crud = "todoapp_crud:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
