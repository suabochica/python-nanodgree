<html>
  <head>
    <title>Todo App</title>
  </head>
  <style>
    .hidden {
      display: none;
    }

    li {
      list-style: none;
    }
  </style>

  <body>
    <div id="error" class="hidden">Something went wrong!</div>
    <form id="form">
      <input type="text" name="description" placeholder="Add a description">
      <input type="submit" value="Create">
    </form>
    <ul id="todos">
      {% for todo in data %}
      <li>
        <input class="check-completed" data-id="{{ todo.id }}" type="checkbox" {% if todo.completed %} checked {% endif %} />
        {{ todo.description }}
        <button class="delete-button" data-id="{{ todo.id }}">&cross;</button>
      </li>
      {% endfor %}
    </ul>
  </body>

  <script>
    const checkboxes = document.querySelectorAll('.check-completed');

    for (let i = 0; i < checkboxes.length; i++) {
      const checkbox = checkboxes[i];
      const todoId = checkbox.dataset['id'];

      checkbox.onchange = function(event) {
        const isChecked = event.target.checked;

        fetch(`/todos/${todoId}/set-completed`, {
          method: 'POST',
          body: JSON.stringify({ completed: isChecked }),
          headers: {
            'Content-Type': 'application/json'
          }
        })
        .then(function() {
          document.getElementById('error').className = 'hidden';
        })
        .catch(function() {
          document.getElementById('error').className = '';
        })
      }
    }

    const deleteButtons = document.querySelectorAll('.delete-button')

    for (let i = 0; i < deleteButtons.length; i++) {
      const deleteButton = deleteButtons[i];

      deleteButton.onclick = function(event) {
        event.preventDefault();
        const todoId = deleteButton.dataset['id'];

        fetch(`/todos/${todoId}`, {
          method: 'DELETE',
        })
        .then(function() {
          deleteButton.parentElement.remove();
          document.getElementById('error').className = 'hidden';
        })
        .catch(function() {
          document.getElementById('error').className = '';
        })
      }
    }



    document.getElementById('form').onsubmit = function(event) {
      event.preventDefault();
      const description = document.querySelector('input[name="description"]').value;
      fetch('/todos/create', {
        method: 'POST',
        body: JSON.stringify({ description: description }),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(function(response) {
        return response.json();
      })
      .then(function(jsonResponse) {
        const liItem = document.createElement("li");
        liItem.innerHTML = `<input class="check-completed" type="checkbox" /> ${jsonResponse['description']}`;
        document.getElementById('todos').appendChild(liItem);
        document.getElementById('error').className = 'hidden';
      })
      .catch(function() {
        document.getElementById('error').className = '';
      })
    }
  </script>
</html>
