[project]
name = "todoapp_migrations"
version = "0.1.0"
description = "Project to understand how works migrations in flask"
readme = "README.md"
authors = [
    { name = "Sergio L. Benítez D.", email = "sergio.kun21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
