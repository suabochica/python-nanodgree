[project]
name = "python-nanodgree"
version = "0.1.0"
description = "Monorepo to store several python projects"
readme = "README.md"
authors = [
    { name = "Sergio L. Benítez D.", email = "sergio.kun21@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
python-nanodgree = "python_nanodgree:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "packages/*",
]
